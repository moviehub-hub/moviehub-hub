<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Stream & Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            padding: 20px;
        }

        /* হেডার ও নেভিগেশন */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 30px 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
        }

        .search-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #333;
            color: #fff;
        }

        /* মুভি গ্রিড লেআউট */
        .movie-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        /* মুভি কার্ড ডিজাইন */
        .movie-card {
            position: relative;
            background-color: #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        /* হোভার এফেক্ট ও অ্যাকশন বাটন */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .movie-card:hover .overlay {
            opacity: 1;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            width: 80%;
            text-align: center;
        }

        .btn-watch {
            background-color: #e50914;
        }

        .btn-download {
            background-color: #28a745;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: 600;
        }

        .movie-details {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">MovieFlix</div>
        <div class="search-box">
            <input type="text" placeholder="Search Movie...">
        </div>
    </header>

    <h2>Popular Movies</h2>
    <br>

    <div class="movie-container">
        <!-- মুভি কার্ড ১ -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
            <div class="overlay">
                <a href="#" class="btn btn-watch">Watch Now</a>
                <a href="#" class="btn btn-download">Download</a>
            </div>
            <div class="movie-info">
                <div class="movie-title">Sample Movie 1</div>
                <div class="movie-details">2026 • Action / Sci-Fi</div>
            </div>
        </div>

        <!-- মুভি কার্ড ২ -->
        <div class="movie-card">
            <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
            <div class="overlay">
                <a href="#" class="btn btn-watch">Watch Now</a>
                <a href="#" class="btn btn-download">Download</a>
            </div>
            <div class="movie-info">
                <div class="movie-title">Sample Movie 2</div>
                <div class="movie-details">2025 • Thriller</div>
            </div>
        </div>
    </div>

</body>
</html>
