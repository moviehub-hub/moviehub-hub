<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #e50914;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #222;
            padding: 20px;
            border-radius: 8px;
        }
        video {
            width: 100%;
            border-radius: 8px;
        }
        .download-btn {
            display: inline-block;
            background-color: #e50914;
            color: white;
            padding: 12px 24px;
            margin-top: 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
        }
        .download-btn:hover {
            background-color: #b80710;
        }
    </style>
</head>
<body>

    <h1>Movie Streaming & Download</h1>

    <div class="container">
        <h2>মুভির নাম: Sample Video</h2>
        
        <!-- ভিডিও প্লেয়ার -->
        <video controls>
            <source src="my-video.mp4" type="video/mp4">
            তোর ব্রাউজার ভিডিও প্লেয়ার সাপোর্ট করছে না।
        </video>

        <br>
        <!-- ডাউনলোড বাটন -->
        <a href="my-video.mp4" download class="download-btn">Movie Download কর</a>
    </div>

</body>
</html>
